# T-35 supported vhost template, included explicitly inside the http context.
# Direct public Nginx ingress only. A CDN/load balancer requires verified T-24
# source/header settings before activation. This file does not prove the live chain.
# Verify the existing certificate paths, SAN, backend role and ports before use.
server {
    listen 80;
    listen [::]:80;
    server_name anonyproof.deline.top;
    # T-33: only this site's request logs are disabled. Keep global/other vhosts.
    access_log off;
    error_log /dev/null;
    if ($http_host = "") { return 404; }
    if ($host != anonyproof.deline.top) { return 404; }
    # Preserve the existing certificate-renewal webroot when adapting this vhost.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
        try_files $uri =404;
    }
    location / { return 308 https://anonyproof.deline.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anonyproof.deline.top;
    access_log off;
    error_log /dev/null;
    ssl_certificate /etc/nginx/ssl/deline.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deline.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_host = "") { return 404; }
    if ($host != anonyproof.deline.top) { return 404; }

    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host anonyproof.deline.top;
    proxy_set_header X-Forwarded-Host anonyproof.deline.top;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-ForwardedFor "";
    proxy_set_header X-ForwardedProto "";
    # Root-owned/private 0600 file containing only:
    # proxy_set_header X-AnonyProof-Proxy-Auth "<independent random base64 key>";
    # This overwrites incoming visitor headers; never put the actual key here.
    include /etc/nginx/private/anonyproof-proxy-auth.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
        try_files $uri =404;
    }
    location = / { return 301 https://anonyproof.deline.top/anonyproof$is_args$args; }
    location = /anonyproof { proxy_pass http://127.0.0.1:3000; }
    location ^~ /anonyproof/ { proxy_pass http://127.0.0.1:3000; }
    location / { return 404; }
}
