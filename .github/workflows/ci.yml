name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Node 20 自带的 npm 10.8.2 存在 "Exit handler never called!" 崩溃问题
    # （npm/cli#7666），固定到 npm 11 规避。
    - name: Upgrade npm
      run: npm install --global npm@11

    # 崩溃时会留下残缺的 node_modules，因此重试并显式校验直接依赖是否装全。
    - name: Install dependencies
      run: |
        verify_dependencies() {
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const required = [
              ...Object.keys(pkg.dependencies || {}),
              ...Object.keys(pkg.devDependencies || {}),
            ];
            const missing = required.filter(
              (name) => !fs.existsSync("node_modules/" + name + "/package.json")
            );
            if (missing.length > 0) {
              console.error("missing dependencies: " + missing.join(", "));
              process.exit(1);
            }
            console.log("dependency tree verified: " + required.length + " direct dependencies");
          '
        }

        for attempt in 1 2 3; do
          if npm ci --no-audit --no-fund --ignore-scripts && verify_dependencies; then
            echo "npm ci succeeded on attempt ${attempt}"
            exit 0
          fi
          echo "::warning::npm ci attempt ${attempt} failed or left an incomplete tree, retrying"
          rm -rf node_modules
          npm cache clean --force || true
        done

        echo "::error::npm ci failed after 3 attempts"
        exit 1

    - name: Show npm debug log
      if: failure()
      run: |
        log_dir="$HOME/.npm/_logs"
        if [ -d "$log_dir" ]; then
          tail -n 60 "$(ls -t "$log_dir"/*.log | head -n 1)" || true
        fi

    - name: Type check
      run: npm run type-check

    - name: Build
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.node-version }}
        path: .next
